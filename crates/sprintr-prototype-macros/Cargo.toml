[package]
name = "sprintr-prototype-macros"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
description = "Compile-time message capture for the standalone sprintr prototype"
license = "Apache-2.0"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
serde_json = "1"
syn = { version = "2", features = ["full"] }
sprintr-message = { path = "../sprintr-message" }

[lints.rust]
unsafe_code = "forbid"
