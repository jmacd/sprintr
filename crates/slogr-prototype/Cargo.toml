[package]
name = "slogr-prototype"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
description = "Non-production standalone JSON Lines logging and playback prototype"
license = "Apache-2.0"
readme = "README.md"
publish = false

[dependencies]
serde_json = "1"
slogr-message = { path = "../slogr-message" }
slogr-prototype-macros = { path = "../slogr-prototype-macros" }

[dev-dependencies]
allocation-counter = "0.8"

[lints.rust]
unsafe_code = "forbid"

[lints.rustdoc]
broken_intra_doc_links = "deny"
