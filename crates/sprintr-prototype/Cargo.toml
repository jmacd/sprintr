[package]
name = "sprintr-prototype"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
description = "Non-production structured printing in Rust with JSON Lines capture and playback"
license = "Apache-2.0"
readme = "README.md"
publish = false

[dependencies]
gettid = "0.1.4"
linkme = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sprintr-message = { path = "../sprintr-message" }
sprintr-prototype-macros = { path = "../sprintr-prototype-macros" }

[dev-dependencies]
allocation-counter = "0.8"

[lints.rust]
unsafe_code = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
