[package]
name = "sprintr-prototype"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
description = "Non-production structured printing in Rust with JSON Lines capture and playback"
license = "Apache-2.0"
readme = "README.md"
publish = false

[dependencies]
backtrace = "0.3"
base64 = "0.22"
blazesym = { version = "0.2.7", default-features = false, features = ["gsym", "demangle"] }
findshlibs = "0.10"
gettid = "0.1.4"
getrandom = "0.3"
linkme = "0.3"
scoped-tls-hkt = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sprintr-message = { path = "../sprintr-message" }
sprintr-prototype-macros = { path = "../sprintr-prototype-macros" }

[target.'cfg(any(target_os = "macos", all(target_os = "linux", target_env = "gnu")))'.dependencies]
libc = "0.2"

[dev-dependencies]
allocation-counter = "0.8"
thiserror = "2"

[lints.rust]
unsafe_code = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
